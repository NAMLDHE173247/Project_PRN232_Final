name: Build, Test and Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore EbayClone.sln

      - name: Build
        run: dotnet build EbayClone.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EbayClone.sln --no-build --configuration Release --verbosity normal

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -t ebayclone-api:${{ github.sha }} -f EbayClone.API/Dockerfile .

      - name: Build MVC image
        run: docker build -t ebayclone-mvc:${{ github.sha }} -f EbayClone.MVC/Dockerfile .

  deploy:
    name: Rolling deploy
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin main
            docker compose build api1 api2
            bash scripts/rolling-update.sh
